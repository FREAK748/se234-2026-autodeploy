name: Deploy to Production
on:
  push:
    branches: [ prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 54.242.60.113 >> ~/.ssh/known_hosts

      - name: Prepare server
        run: |
          ssh -o ConnectTimeout=120 -o ServerAliveInterval=30 -o ServerAliveCountMax=4 ubuntu@54.242.60.113 "
            sudo rm -rf /var/www/html/*
            sudo chown -R ubuntu:ubuntu /var/www/html
          "

      - name: Upload files
        run: |
          scp -o ConnectTimeout=120 html/* ubuntu@54.242.60.113:/var/www/html/

      - name: Finalize
        run: |
          ssh -o ConnectTimeout=120 ubuntu@54.242.60.113 "
            sudo chown -R www-data:www-data /var/www/html
            sudo systemctl restart nginx
          "